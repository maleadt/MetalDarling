# What the workflow builds: Darling at an upstream base commit with our topic branches merged
# onto it, in order, and some of its submodules likewise moved to a base and given topics. Commits are full SHAs; a
# topic's branch is informational (it says where to look when bumping) and may have moved on.
# scripts/apply-stack.py materializes this and writes stack.lock.

[darling]
repo = "darlinghq/darling"
base = "6ac4c0d73747e041e971ac920933f3db6bb73659"           # master, 2026-11-24 (has #2506, #2507)

# Overrides are applied outermost first; a component's own submodules are initialized from
# the result, so indium below is the one darling-metal's merged tree would pin, then replaced.
# darlingserver, xnu and syslog only move to upstream commits newer than darling's pins.
[[darling.override]]
path = "src/external/darlingserver"
repo = "darlinghq/darlingserver"
base = "09146c9312b3cc1b2f61e578b886ed50f02ff901"           # main, 2026-11-24 (has #106-#109; darling pins e9bbb29)

[[darling.override]]
path = "src/external/xnu"
repo = "darlinghq/darling-xnu"
base = "3d6c8eb8609e9ef27801535ad57f45ca5d89c529"           # main, 2026-11-24 (has #154; darling pins 3afeb85)

[[darling.override]]
path = "src/external/syslog"
repo = "darlinghq/darling-syslog"
base = "72330695b8f671dfde952755a23169279f1235f5"           # master, 2026-11-24 (has #5; darling pins 55aab05)

# The four branches each add a test to the same list in test/guest/build.sh, so they are
# merged, in this order, on one branch: tb/empty-library (0ad9c45), tb/msl-function-constants
# (bdf78b7), tb/function-constant-types (e0dc60b, on msl-function-constants) and
# tb/library-function-names (adbb185). They need indium #71-#73 and mslc #8 and #9 below.
[[darling.override]]
path = "src/external/metal"
repo = "darlinghq/darling-metal"
base = "3c98ce3f381fb075a5d2432cea8546abe3b4f247"           # main, 2026-11-24 (has #76-#85; darling pins a1e1cee)
topics = [
    { repo = "maleadt/darling-metal", branch = "tb/metaldarling-stack", commit = "8493432a85cbf24a2c80a3c1f51b4b8cd662d795" },
]

# One branch: darlinghq/indium #53, #54, #56-#79 merged in PR order at their heads (#59 builds
# on #56, #75 on #74 and #76 on #75), then the byte-addressing prototype of
# tb/addressing-prototype (96a6c66; issue #52), ported onto #53, and a fix-up of air-ops'
# kernel list for #54 with #73.
[[darling.override]]
path = "src/external/metal/deps/indium"
repo = "darlinghq/indium"
base = "34b2cb2c4dd8895f78b31d1ad508c915076970aa"           # main, 2026-11-24 (darling-metal pins 329f82e)
topics = [
    { repo = "maleadt/indium", branch = "tb/metaldarling-stack", commit = "7148ed3a48ebf513d9dc23ef2e4d6c46117dedc8" },
]

# One branch: darlinghq/mslc #7, #8 and #9 merged in order (#8 and #9 both extend
# tests/library_api.c).
[[darling.override]]
path = "src/external/metal/deps/mslc"
repo = "darlinghq/mslc"
base = "74d0f8992c4947a753a7903f1ff8a74915e560de"           # master, 2026-11-22 (darling-metal's pin)
topics = [
    { repo = "maleadt/mslc", branch = "tb/metaldarling-stack", commit = "4289f887888d2eacc821c19ff96d43e8422d6ef0" },
]

# The official macOS x86_64 Julia, unpacked into the image.
[julia]
version = "1.13.4"
url = "https://julialang-s3.julialang.org/bin/mac/x64/1.13/julia-1.13.4-mac64.tar.gz"
sha256 = "c84de0fcb4268841f296fd56c47c27383d81358033428389b0d1882b110b9bcd"

# The Metal.jl the smoke test runs the survey with.
[metal]
repo = "JuliaGPU/Metal.jl"
base = "80822e14041d19f4a80e5e0644d80c55f7d3a49f"           # tb/residency-set-descriptor (#1183, on #1174-#1182)
